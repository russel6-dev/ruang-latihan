name: Proses lagu
run-name: "job ${{ inputs.job }}"

on:
  workflow_dispatch:
    inputs:
      job:
        description: "ID proses (dibuat aplikasi di HP)"
        required: true

permissions:
  contents: write
  statuses: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Kabari HP bahwa proses dimulai
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/${{ github.repository }}/git/ref/heads/inbox/${{ inputs.job }}" --jq .object.sha)
          gh api "repos/${{ github.repository }}/statuses/$sha" -f state=pending -f context=ruang-latihan -f description="setup|0"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Cache model AI
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: demucs-htdemucs_6s-v1

      - name: Pasang ffmpeg & library
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install torch==2.3.1 torchaudio==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" cython
          pip install --no-build-isolation diffq
          pip install -r engine/requirements.txt

      - name: Pisah instrumen & deteksi ketukan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python engine/process.py "${{ inputs.job }}"

      - name: Lapor gagal
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/${{ github.repository }}/git/ref/heads/inbox/${{ inputs.job }}" --jq .object.sha) || exit 0
          state=$(gh api "repos/${{ github.repository }}/commits/$sha/status" --jq .state)
          [ "$state" = "failure" ] || gh api "repos/${{ github.repository }}/statuses/$sha" -f state=failure -f context=ruang-latihan -f description="error|Gagal saat menyiapkan server"
